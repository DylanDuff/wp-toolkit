# Runs the WordPress-free test suites on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Schema renderer
        run: php tests/schema/run.php
